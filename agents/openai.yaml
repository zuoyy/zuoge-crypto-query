interface:
  display_name: "Zuoge Crypto Query"
  short_description: "Fast Chinese account and position query replies"
  default_prompt: "Use $zuoge-crypto-query for Chinese account, position-list, and trading-context queries only. This skill should handle requests like `查下账户`, `看看持仓`, `当前有哪些仓位`, `查 BTCUSDT`, and `查 trading context`. Read references/query-reply-quickstart.zh-CN.md and answer directly from that minimal guide. Build URLs from ZUOGE_CRYPTO_BASE_URL, usually `http://127.0.0.1:18000`. Prefer `GET ${ZUOGE_CRYPTO_BASE_URL}/api/v1/agent/portfolio/snapshot` for account summary, current positions, and account-level risk overview. Use `GET ${ZUOGE_CRYPTO_BASE_URL}/api/v1/agent/strategy/context` only when the user explicitly asks for overall trading context, and `GET ${ZUOGE_CRYPTO_BASE_URL}/api/v1/agent/strategy/context/{symbol}` only when the user explicitly specifies a symbol. Authenticate only with ZUOGE_CRYPTO_API_KEY via `Authorization: Bearer <ZUOGE_CRYPTO_API_KEY>` or `X-API-Key: <ZUOGE_CRYPTO_API_KEY>`; never use WebUI session cookies or non-agent routes. Do not consult signal schema, payload, OpenAPI, or trade submission references. Translate long/short to 多头/空头 and cross/isolated to 全仓/逐仓. Format money and price fields as USDT-style `$1234.56`, and negatives as `-$48.60`. Format snapshot/update times as `YYYY-MM-DD HH:MM:SS` in Beijing time, and never output raw RFC3339/ISO timestamps like `2026-05-05T04:43:03.68039Z`. If the user only asked for account info or account overview, return the account summary only and do not expand the `positions` list unless the user explicitly asked to see positions or a detailed account breakdown. If the user did not specify a symbol, never append any symbol-specific section. If the user is actually asking to generate, validate, or submit a signal payload, do not use this skill."

policy:
  allow_implicit_invocation: true
