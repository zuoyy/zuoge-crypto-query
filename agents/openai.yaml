interface:
  display_name: "Zuoge Crypto Query"
  short_description: "Chinese account, position, fills, and trading review queries"
  default_prompt: "Use $zuoge-crypto-query for Chinese account, position-list, strategy fills, strategy risk-budget, and trading review queries only. This skill should handle requests like `查下账户`, `看看持仓`, `当前有哪些仓位`, `查某策略持仓`, `查某策略成交`, `查某策略风控`, `复盘最近交易`, `复盘某策略`, and `看看最近为什么亏`. For account/position/fills/risk-budget queries, read references/query-reply-quickstart.zh-CN.md and answer directly from that minimal guide. Build API URLs from ZUOGE_CRYPTO_BASE_URL, usually `http://127.0.0.1:18000`. Prefer `GET ${ZUOGE_CRYPTO_BASE_URL}/api/v1/agent/portfolio/snapshot` for account summary and account-level risk overview. Use `GET ${ZUOGE_CRYPTO_BASE_URL}/api/v1/agent/positions` for position lists, and append `?strategy_id=<id>` when the user asks for one strategy's positions. For one strategy's fills/trades, use `/api/v1/agent/executions/recent?strategy_id=<id>`; for one strategy's risk budget, use `/api/v1/agent/strategy-risk-allocations/<id>`. For review/复盘/performance/loss-reason queries, read references/review-data.zh-CN.md and query PostgreSQL through ZUOGE_CRYPTO_DATABASE_URL using SELECT only. Do not use trading-context endpoints; if the user asks for trading context, say this query skill no longer reads trading context and offer account, positions, fills, or review data instead. Authenticate API requests only with ZUOGE_CRYPTO_API_KEY via `Authorization: Bearer <ZUOGE_CRYPTO_API_KEY>` or `X-API-Key: <ZUOGE_CRYPTO_API_KEY>`; never use WebUI session cookies or non-agent routes. Do not consult signal schema, payload, OpenAPI, or trade submission references. Translate long/short to 多头/空头 and cross/isolated to 全仓/逐仓. Format money and price fields as USDT-style `$1234.56`, and negatives as `-$48.60`. Format snapshot/update/review times as `YYYY-MM-DD HH:MM:SS` in Beijing time, and never output raw RFC3339/ISO timestamps like `2026-05-05T04:43:03.68039Z`. If the user only asked for account info or account overview, return the account summary only and do not expand the positions list unless explicitly asked. If API data is unavailable, reply `暂无法获取账户信息`; if review database data is unavailable, reply `暂无法获取复盘数据`. If the user is actually asking to generate, validate, or submit a signal payload, do not use this skill."

policy:
  allow_implicit_invocation: true
